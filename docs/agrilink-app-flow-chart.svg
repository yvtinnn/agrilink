<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="720" height="860" fill="#ffffff"/>
  <text x="360" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">AgriLink — App Flow Chart</text>

  <!-- Start -->
  <ellipse cx="360" cy="100" rx="95" ry="32" fill="#dcfce7" stroke="#1a7a3c" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" font-size="15" fill="#14532d">Start Platform</text>
  <line x1="360" y1="132" x2="360" y2="172" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Input Location -->
  <rect x="230" y="180" width="260" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="214" text-anchor="middle" font-size="15" fill="#1e3a8a">Input Location Details</text>
  <line x1="360" y1="236" x2="360" y2="276" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <polygon points="360,284 490,336 360,388 230,336" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="360" y="342" text-anchor="middle" font-size="15" fill="#713f12">Valid Location?</text>

  <!-- No loop -->
  <path d="M 490 336 L 610 336 L 610 208 L 496 208" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="326" text-anchor="middle" font-size="13" fill="#4a5568">No</text>

  <!-- Yes -->
  <path d="M 360 388 L 360 428" fill="none" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="415" text-anchor="end" font-size="13" fill="#4a5568">Yes</text>

  <!-- Process data -->
  <rect x="230" y="432" width="260" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="458" text-anchor="middle" font-size="15" fill="#1e3a8a">Process Meteorological Data</text>
  <text x="360" y="478" text-anchor="middle" font-size="12" fill="#3b82f6">(live forecast + seasonal history)</text>

  <!-- Branches -->
  <line x1="360" y1="488" x2="360" y2="520" stroke="#4a5568" stroke-width="2"/>
  <line x1="120" y1="520" x2="600" y2="520" stroke="#4a5568" stroke-width="2"/>
  <line x1="120" y1="520" x2="120" y2="548" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="520" x2="360" y2="548" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="520" x2="600" y2="548" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="552" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="582" text-anchor="middle" font-size="14" fill="#1e3a8a">Predictive Crop</text>
  <text x="120" y="602" text-anchor="middle" font-size="14" fill="#1e3a8a">Planning</text>

  <rect x="270" y="552" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="582" text-anchor="middle" font-size="14" fill="#1e3a8a">Growth Lifecycle</text>
  <text x="360" y="602" text-anchor="middle" font-size="14" fill="#1e3a8a">Tracking</text>

  <rect x="510" y="552" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="582" text-anchor="middle" font-size="14" fill="#1e3a8a">Peer-to-Peer</text>
  <text x="600" y="602" text-anchor="middle" font-size="14" fill="#1e3a8a">Farmer Community</text>

  <path d="M 120 622 L 120 690 L 340 690" fill="none" stroke="#4a5568" stroke-width="2"/>
  <path d="M 360 622 L 360 690" fill="none" stroke="#4a5568" stroke-width="2"/>
  <path d="M 600 622 L 600 690 L 380 690" fill="none" stroke="#4a5568" stroke-width="2"/>
  <line x1="360" y1="690" x2="360" y2="716" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="720" width="260" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="742" text-anchor="middle" font-size="15" fill="#1e3a8a">Optimize Resource Efficiency</text>
  <text x="360" y="762" text-anchor="middle" font-size="12" fill="#3b82f6">(less waste, less risk)</text>
  <line x1="360" y1="776" x2="360" y2="806" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="810" width="260" height="46" rx="10" fill="#fef4dc" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="839" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Maximize Crop Yields 🌟</text>
</svg>
